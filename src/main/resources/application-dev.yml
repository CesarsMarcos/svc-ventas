server:
  port: ${PORT}
spring:
  application:
    name: svc-ventas
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    #show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  datasource:
    url: jdbc:mysql://${DB_HOST}/${DB_DATABASE}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      pool-name: namePool
    tomcat:
      max-wait: 20000
      max-active: 50
      max-idle: 20
      min-idle: 15
  sql:
    init:
      mode: never
      continue-on-error: true
  main:
    lazy-initialization: true
  open-in-view: false
  thymeleaf:
    cache: true
token:
  apis:
    externa: apis-token-11190.XuZgRhBonrjpjA5JmQdGWN5mlOfUhujN
logging:
  level:
    org:
      hibernate:
        SQL: OFF
    #root: WARN
