version: "3.9"
services:
  mysql8:
    container_name: mysql8
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABSE: bd_ventas
    volumes:
      - data-mysql:/var/lib/mysql
    restart: always
    networks:
      - spring
      
  svc-ventas:
    container_name: svc-ventas
    #image: ventas
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - "8081:8089"
    #env_file: .env
    networks:
      - spring
    depends_on:
      - mysql8
    restart: always

networks:
  spring:
    name: spring
volumes:
  data-mysql:
    name: data-mysql
  
  